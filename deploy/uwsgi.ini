[uwsgi]
chdir = /label-studio/label_studio
module = core.wsgi:application
master = true

# Single-container deployment: tune workers for ~100 concurrent users.
# PostgreSQL also runs inside the same container, so leave headroom for it.
processes = 4
threads = 8
enable-threads = true

harakiri = 1000
max-requests = 5000
vacuum = true
die-on-term = true
disable-logging = true
pidfile = /tmp/%n.pid
buffer-size = 65535
disable-write-exception = true

# Serve static files directly through uwsgi since there is no nginx.
static-map = /static=core/static_build
static-map = /react-app=/label-studio/label_studio/frontend/dist/react-app
static-map = /label-studio-frontend=/label-studio/label_studio/frontend/dist/lsf
static-map = /dm=/label-studio/label_studio/frontend/dist/dm
static-expires = /static/.* 86400
static-expires = /react-app/.* 86400
static-expires = /label-studio-frontend/.* 86400
static-expires = /dm/.* 86400

log-master = true
protocol = http
socket = 0.0.0.0:8080
