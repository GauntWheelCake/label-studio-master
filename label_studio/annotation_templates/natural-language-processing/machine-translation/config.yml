title: 机器翻译
type: community
group: 自然语言处理
image: /static/templates/machine-translation.png
details: <h1>将英文文本翻译为中文</h1>
config: '
<View>
  <View style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 1em">
    <Header value="英文原文" />
    <Header value="中文译文" />

    <Text name="source" value="$source" />

    <TextArea
      name="target"
      toName="source"
      transcription="true"
      showSubmitButton="true"
      maxSubmissions="1"
      editable="true"
      required="true"
    />
  </View>
</View>
'
