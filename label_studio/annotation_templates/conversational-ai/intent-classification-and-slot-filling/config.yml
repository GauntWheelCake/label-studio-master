title: 目的分类和槽填充
type: community
group: 人工智能对话
image: /static/templates/intent-classification-and-slot-filling.png
details: <h1>通过选择对话意图并抽取槽位实体来构建面向任务的对话系统</h1>
config: '
<View>
  <ParagraphLabels name="entity_slot" toName="dialogue">
    <Label value="人物" />
    <Label value="组织" />
    <Label value="地点" />
    <Label value="日期时间" />
    <Label value="数量" />
  </ParagraphLabels>
  <Paragraphs name="dialogue" value="$humanMachineDialogue" layout="dialogue" />
    <Choices name="intent" toName="dialogue"
         choice="single" showInLine="true">
        <Choice value="问候"/>
        <Choice value="客户请求"/>
        <Choice value="闲聊"/>
    </Choices>
</View>
'
