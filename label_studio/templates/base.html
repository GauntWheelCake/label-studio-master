{% load static %}
{% load i18n %}
{% load rules %}
{% load filters %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="author" content="Label Studio"/>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=0.9, shrink-to-fit=no">

  <!-- Address string color -->
  <meta name="theme-color" content="#272727"> <!-- Chrome, Firefox OS and Opera -->
  <meta name="msapplication-navbutton-color" content="#272727">  <!-- Windows Phone -->
  <meta name="apple-mobile-web-app-status-bar-style" content="#272727">  <!-- iOS Safari -->

  <link href="{{settings.HOSTNAME}}{% static 'images/favicon.ico' %}" rel="shortcut icon"/>
  <link href="{{settings.HOSTNAME}}{% static 'css/uikit.css' %}" rel="stylesheet">
  <link href="{{settings.HOSTNAME}}{% static 'css/main.css' %}" rel="stylesheet">
  <link href="{{settings.HOSTNAME}}/static/fonts/roboto/roboto.css" rel="stylesheet">
  <link href="{{settings.HOSTNAME}}/react-app/main.css?v={{ versions.backend.commit }}" rel="stylesheet">

  <script src="{{settings.HOSTNAME}}{% static 'js/jquery.min.js' %}"></script>
  <script src="{{settings.HOSTNAME}}{% static 'js/helpers.js' %}"></script>

  <script>
    EDITOR_JS = "{{settings.HOSTNAME}}/label-studio-frontend/js/main.js?v={{ versions.lsf.commit }}";
    EDITOR_CSS = "{{settings.HOSTNAME}}/label-studio-frontend/css/main.css?v={{ versions.lsf.commit }}";
    DM_JS = "{{settings.HOSTNAME}}/dm/js/main.js?v={{ versions.dm2.commit }}";
    DM_CSS = "{{settings.HOSTNAME}}/dm/css/main.css?v={{ versions.dm2.commit }}";
  </script>

  <script
   src="https://browser.sentry-cdn.com/5.17.0/bundle.min.js"
   integrity="sha384-lowBFC6YTkvMIWPORr7+TERnCkZdo5ab00oH5NkFLeQUAmBTLGwJpFjF6djuxJ/5"
   crossorigin="anonymous"></script>

  <script>
    window.exports = () => {};
  </script>

  {% block head %}
    <title>Label Studio</title>
  {% endblock %}

  {% get_current_language as LANGUAGE_CODE %}
  {% get_available_languages as LANGUAGES %}
</head>

<body>

<div class="app-wrapper"></div>

<template id="main-content">
  <main class="main" style="background: transparent">

      <div class="ui floating dropdown theme basic" style="float: right;">
        {% block top-buttons %}
        {% endblock %}
      </div>
    </div>

    <!-- Space & Divider -->
    {% block divider %}
      <div class="ui divider divider-wide"></div>
    {% endblock %}

    <!-- Content -->
    {% block content %}
    {% endblock %}

  </main>
</template>

<template id="context-menu-left">
  {% block context_menu_left %}{% endblock %}
</template>

<template id="context-menu-right">
  {% block context_menu_right %}{% endblock %}
</template>

<script id="app-settings">
  window.APP_SETTINGS = Object.assign({
    user: {
      id:"{{ user.id }}",
      username: "{{user.username}}",
      firstName: "{{user.first_name}}",
      lastName: "{{user.last_name}}",
      initials: "{{user.get_initials}}",
      email: "{{user.email}}",
      {% if user.avatar %}
      avatar: "{{user.avatar_url}}",
      {% endif %}
    },
    debug: {{settings.DEBUG|yesno:"true,false"}},
    hostname: "{{settings.HOSTNAME}}",
    version: {{ versions|json_dumps_ensure_ascii|safe }},
  }, {% block frontend_settings %}{}{% endblock %});
</script>

<script>
  (function() {
    const translations = {
      DONE: '完成！',
      NO_COMP_LEFT: '没有更多标注任务',
      NO_NEXT_TASK: '没有更多可供标注的数据',
      NO_ACCESS: '您没有权限访问此任务',
    };

    const patchLabelStudio = () => {
      const LS = window.LabelStudio;
      if (!LS || LS.__I18N_PATCHED__) return false;

      const WrappedLS = function(root, options = {}) {
        const merged = {
          ...options,
          messages: {
            ...translations,
            ...(options.messages ?? {}),
          },
        };

        return Reflect.construct(LS, [root, merged], new.target || WrappedLS);
      };

      Object.assign(WrappedLS, LS);
      WrappedLS.prototype = LS.prototype;
      Object.setPrototypeOf(WrappedLS, LS);
      WrappedLS.__I18N_PATCHED__ = true;
      window.LabelStudio = WrappedLS;
      return true;
    };

    const patchDataManagerBundle = () => {
      const chunk = window.webpackChunkDataManager;
      if (!chunk || chunk.__I18N_PATCHED__) return false;

      let requireFn;
      chunk.push([[Symbol('i18n-patch')], {}, (req) => { requireFn = req; }]);
      chunk.pop();

      if (!requireFn) return false;

      const findModuleId = (matcher) => {
        for (const [id, factory] of Object.entries(requireFn.m)) {
          if (factory && matcher(factory.toString())) return id;
        }
        return null;
      };

      const modalModuleId = findModuleId((source) => source.includes('components/Common/Modal/Modal.js'));

      if (modalModuleId) {
        const modalExports = requireFn(modalModuleId);

        if (modalExports?.confirm && !modalExports.confirm.__I18N_PATCHED__) {
          const originalConfirm = modalExports.confirm;

          modalExports.confirm = (config = {}) => {
            const nextConfig = {
              cancelText: '取消',
              okText: '确定',
              ...config,
            };

            if (nextConfig.title === 'Confirm action.') nextConfig.title = '确认操作';
            if (nextConfig.title === 'Destructive action.') nextConfig.title = '危险操作';

            return originalConfirm(nextConfig);
          };

          modalExports.confirm.__I18N_PATCHED__ = true;
        }

        if (modalExports?.info && !modalExports.info.__I18N_PATCHED__) {
          const originalInfo = modalExports.info;

          modalExports.info = (config = {}) => {
            const nextConfig = {
              okText: '确定',
              ...config,
            };

            return originalInfo(nextConfig);
          };

          modalExports.info.__I18N_PATCHED__ = true;
        }
      }

      chunk.__I18N_PATCHED__ = true;
      return true;
    };

    const tryPatch = (fn) => {
      const attempt = setInterval(() => {
        if (fn()) clearInterval(attempt);
      }, 100);
    };

    tryPatch(patchLabelStudio);
    tryPatch(patchDataManagerBundle);
  })();
</script>

<script src="{{settings.HOSTNAME}}/react-app/index.js?v={{ versions.backend.commit }}"></script>

<div id="dynamic-content">
  <script>
      applyCsrf();

      $('.message .close').on('click', function () {
           $(this).closest('.message').transition('fade');
      });
  </script>

  {% block bottomjs %}
  {% endblock %}

</div>

</body>
</html>
