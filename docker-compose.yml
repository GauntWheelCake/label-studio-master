services:

  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    depends_on:
      - app
    volumes:
      - static-build:/label-studio/label_studio/core/static_build:ro
      - frontend-dist:/label-studio/label_studio/frontend/dist:ro
      - ./mydata:/label-studio/data:rw
      - ./deploy/nginx/${NGINX_FILE:-default.conf}:/etc/nginx/conf.d/default.conf:ro
    command: nginx -g "daemon off;"

  app:
    stdin_open: true
    tty: true
    build: .
    image: heartexlabs/label-studio:latest
    expose:
      - "8080"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - ENABLE_SHARED_ADMIN_MODE=${ENABLE_SHARED_ADMIN_MODE:-false}
      - SSO_USERINFO_HOST=${SSO_USERINFO_HOST:-68.68.18.26:31798}
      - SSO_DEBUG_MOCK=${SSO_DEBUG_MOCK:-false}
    volumes:
      - ./mydata:/label-studio/data:rw
      - static-build:/label-studio/label_studio/core/static_build:rw
      - frontend-dist:/label-studio/label_studio/frontend/dist:rw
    command: [ "./deploy/wait-for-postgres.sh", "bash", "/label-studio/deploy/start_label_studio.sh" ]

  db:
    image: postgres:11.5
    hostname: db
    restart: always
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data

volumes:
  static-build: {}
  frontend-dist: {}
