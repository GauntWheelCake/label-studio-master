services:

  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    depends_on:
      - app
    volumes:
      - static-build:/label-studio/label_studio/core/static_build:ro
      - frontend-dist:/label-studio/label_studio/frontend/dist:ro
      - ./mydata:/label-studio/data:rw
      - ./deploy/nginx/${NGINX_FILE:-default.conf}:/etc/nginx/conf.d/default.conf:ro
    command: nginx -g "daemon off;"

  app:
    stdin_open: true
    tty: true
    build: .
    image: heartexlabs/label-studio:latest
    expose:
      - "8080"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - ENABLE_SHARED_ADMIN_MODE=${ENABLE_SHARED_ADMIN_MODE:-true}
      - SHARED_ADMIN_FIXED_TOKEN=${SHARED_ADMIN_FIXED_TOKEN:-shared-admin-fixed-token}
      - ML_HOST=${ML_HOST:-http://ml-backend-image:9091}
      - ML_IMAGE_HOST=${ML_IMAGE_HOST:-http://ml-backend-image:9091}
      - ML_TEXT_HOST=${ML_TEXT_HOST:-}
      - ML_LABEL_STUDIO_URL=${ML_LABEL_STUDIO_URL:-http://app:8080}
      - SSO_USERINFO_HOST=${SSO_USERINFO_HOST:-68.68.18.26:31798}
      - SSO_DEBUG_MOCK=${SSO_DEBUG_MOCK:-false}
    volumes:
      - ./mydata:/label-studio/data:rw
      - static-build:/label-studio/label_studio/core/static_build:rw
      - frontend-dist:/label-studio/label_studio/frontend/dist:rw
    command: [ "./deploy/wait-for-postgres.sh", "bash", "/label-studio/deploy/start_label_studio.sh" ]

  ml-backend-image:
    build:
      context: ${ML_IMAGE_BACKEND_CONTEXT:-../ml_integration_v2_ImageAnnotation}
    image: huibiao/ml-backend-image:latest
    ports:
      - "${ML_IMAGE_BACKEND_PORT:-9091}:9091"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_URL=${LABEL_STUDIO_URL:-http://app:8080}
      - LABEL_STUDIO_API_TOKEN=${LABEL_STUDIO_API_TOKEN:-${SHARED_ADMIN_FIXED_TOKEN:-shared-admin-fixed-token}}
      - ML_BACKEND_PORT=9091
      - ML_BACKEND_URL=${ML_IMAGE_BACKEND_PUBLIC_URL:-http://localhost:9091}
      - MODEL_VERSION=${ML_IMAGE_MODEL_VERSION:-faster-rcnn-resnet50-v1.0}
      - MODEL_VERSION_OPTIONS=${ML_IMAGE_MODEL_VERSION_OPTIONS:-faster-rcnn-resnet50-v1.0}
      - CONFIDENCE_THRESHOLD=${ML_IMAGE_CONFIDENCE_THRESHOLD:-0.7}
      - IMAGE_REQUEST_TIMEOUT=${ML_IMAGE_REQUEST_TIMEOUT:-20}
      - INFERENCE_DEVICE=${ML_IMAGE_INFERENCE_DEVICE:-cpu}

  db:
    image: postgres:11.5
    hostname: db
    restart: always
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data

volumes:
  static-build: {}
  frontend-dist: {}
